==================== 文件：docker-compose.yml ====================
version: '3.8'

services:
api:
build: .
command: uvicorn src.api.routes:app --host 0.0.0.0 --port 8000 --reload
ports:

"8000:8000"
env_file:

.env
volumes:

./src:/app/src
streamlit:
build: .
command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
ports:

"8501:8501"
env_file:

.env
depends_on:

api
